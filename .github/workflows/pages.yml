name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy job needs these; nothing else in the repo does.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer push supersedes an older one still queued.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Pages must be switched on once by a repo admin before this can run:
      # Settings > Pages > Build and deployment > Source: GitHub Actions.
      # The workflow token cannot create the site itself.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
